<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>薪資助理</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            position: relative;
        }
        
        .screenshot-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background-color: #0f172a;
            padding: 2px;
        }

        .dashboard { background: linear-gradient(135deg, #1e293b, #334155); border-radius: 18px; padding: 12px; margin-bottom: 8px; border: 1px solid #475569; flex-shrink: 0; }
        .dash-flex { display: flex; justify-content: space-between; align-items: center; }
        .total-money { font-size: 28px; font-weight: 800; color: #38bdf8; }
        .export-btn { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .export-btn:active { background: #38bdf8; color: #0f172a; }
        
        .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #475569; }
        .config-box { display: flex; flex-direction: column; gap: 3px; }
        .config-box label { font-size: 10px; color: #94a3b8; font-weight: 700; text-align: center; }
        .config-input { background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #34d399; padding: 6px 2px; font-size: 13px; font-weight: 700; width: 100%; text-align: center; user-select: text !important; -webkit-user-select: text !important; }
        #tips-input { color: #f43f5e; }
        .stats { display: flex; gap: 8px; font-size: 11px; margin-top: 6px; opacity: 0.9; justify-content: space-between; font-weight: 600; }
        
        .main-layout { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        
        .calendar-container { flex: 1; background: #1e293b; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; overflow: hidden; min-height: 0; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 16px; margin-bottom: 6px; flex-shrink: 0; }
        .cal-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; width: 30px; height: 30px; border-radius: 8px; font-weight: 800; }
        .cal-btn:active { background: #38bdf8; color: #000; }
        #calendar-title { cursor: pointer; padding: 4px 8px; border-radius: 8px; }
        #calendar-title:active { background: rgba(56, 189, 248, 0.15); }

        .week-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 4px; flex-shrink: 0; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(5, 1fr); flex: 1; gap: 4px; height: 100%; min-height: 0; touch-action: pan-y; }
        
        .day-cell { 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 3px 3px 2px 3px;
            height: 100%; 
            min-height: 0; 
        }
        
        .day-cell.single-bounce { animation: cellPopBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; }
        @keyframes cellPopBounce { 0% { transform: scale(1); } 30% { transform: scale(1.15); box-shadow: 0 0 15px #38bdf8; } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }

        .day-cell.today-box { border: 2px solid #38bdf8 !important; box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.3), 0 0 6px rgba(56, 189, 248, 0.3); }
        .day-cell.today-box .day-num { color: #38bdf8 !important; font-weight: 900; }

        .cell-top { display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 2; }
        .day-num-box { display: flex; align-items: center; gap: 2px; }
        .day-num { font-size: 13px; font-weight: 800; color: #94a3b8; line-height: 1; }
        .weather-icon { font-size: 11px; line-height: 1; }
        
        .holiday-name { 
            font-size: 9px; 
            color: #f43f5e; 
            font-weight: 800; 
            text-align: right; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 42px; 
            line-height: 1;
        }
        .holiday-name.typhoon { color: #c084fc !important; font-weight: 900; }

        .day-status { 
            font-size: 20px; 
            font-weight: 900; 
            text-align: center; 
            width: 100%; 
            line-height: 1;
            z-index: 1; 
            pointer-events: none; 
            margin: auto 0;
        }
        .day-status.bounce-active { animation: popBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popBounce { 0% { transform: scale(1); } 30% { transform: scale(1.35); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }

        .cell-bottom { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 2px; 
            width: 100%; 
            z-index: 2; 
        }

        .day-note-badge {
            flex: 1;
            min-width: 0;
            font-size: 10px; 
            font-weight: 800; 
            color: #cbd5e1; 
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.25); 
            padding: 1px 3px; 
            border-radius: 3px;
            pointer-events: none; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
            line-height: 1.1;
        }

        .day-tips-badge { 
            font-size: 9.5px; 
            font-weight: 900; 
            color: #ffffff; 
            background: #e11d48; 
            padding: 1px 3px; 
            border-radius: 3px; 
            white-space: nowrap;
            line-height: 1.1;
            flex-shrink: 0;
        }

        .status-full .day-note-badge, .status-half .day-note-badge { background: rgba(0, 0, 0, 0.75); color: #fff; border-color: transparent; }
        .status-full { background: #00ff66 !important; border-color: #00ff66; } .status-full .day-num, .status-full .day-status { color: #000 !important; } 
        .status-half { background: #ffaa00 !important; border-color: #ffaa00; } .status-half .day-num, .status-half .day-status { color: #000 !important; } 
        .status-rain { background: #450a0a !important; border: 2px dashed #ef4444 !important; } .status-rain .day-num, .status-rain .day-status { color: #f87171; }
        .other-month { opacity: 0.08; pointer-events: none; }

        /* CS 戰術輪盤 */
        .radial-menu { display: none; position: fixed; width: 160px; height: 160px; z-index: 9999; transform: translate(-50%, -50%); pointer-events: none; }
        .radial-bg { position: absolute; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.96); border: 2px solid rgba(56, 189, 248, 0.4); border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden; }
        .radial-bg::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 49.5%, rgba(51, 65, 85, 0.4) 49.5%, rgba(51, 65, 85, 0.4) 50.5%, transparent 50.5%), linear-gradient(-45deg, transparent 49.5%, rgba(51, 65, 85, 0.4) 49.5%, rgba(51, 65, 85, 0.4) 50.5%, transparent 50.5__);
            z-index: 1;
        }
        .radial-line { position: absolute; top: 80px; left: 80px; width: 0px; height: 2px; background: #38bdf8; transform-origin: left center; box-shadow: 0 0 8px #38bdf8; z-index: 2; }
        .weapon-option { position: absolute; font-size: 13px; font-weight: 800; color: #64748b; display: flex; align-items: center; justify-content: center; width: 60px; height: 50px; text-align: center; z-index: 5; white-space: nowrap; transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.1s, font-size 0.1s, opacity 0.1s; }
        .opt-full { top: 8px; left: 50px; } .opt-half { top: 55px; right: 2px; } .opt-rain { bottom: 8px; left: 50px; } .opt-clear { top: 55px; left: 2px; color: #94a3b8; }   
        .weapon-option.highlight { color: #22d3ee !important; font-size: 26px !important; text-shadow: 0 0 20px #06b6d4, 0 0 40px #06b6d4; opacity: 1 !important; z-index: 999; }
        .opt-full.highlight  { transform: translateY(-12px); } .opt-half.highlight  { transform: translateX(12px); } .opt-rain.highlight  { transform: translateY(12px); } .opt-clear.highlight { transform: translateX(-12px); color: #f43f5e !important; text-shadow: 0 0 20px #ef4444; }
        
        /* 備註抽屜 */
        .drawer-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); z-index: 10001; display: none; opacity: 0; transition: opacity 0.2s; }
        .drawer-mask.show { display: block; opacity: 1; }
        .note-drawer { position: fixed; bottom: -300px; left: 0; right: 0; background: #1e293b; border-top: 1px solid #475569; border-radius: 20px 20px 0 0; padding: 16px; z-index: 10002; transition: bottom 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .note-drawer.show { bottom: 0; }
        .drawer-title { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .quick-tags { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
        .tag-btn { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .tag-btn:active { background: #38bdf8; color: #000; }
        .drawer-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        .drawer-actions { display: flex; gap: 8px; }
        .drawer-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; border: none; }
        .btn-confirm { background: #38bdf8; color: #0f172a; }
        .btn-clear { background: #334155; color: #f43f5e; }

        #toast { 
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); 
            background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(56, 189, 248, 0.5); color: #38bdf8; 
            padding: 6px 20px; border-radius: 50px; font-size: 12px; opacity: 0; 
            transition: opacity 0.2s; pointer-events: none; z-index: 10000; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .physics-particle { position: fixed; pointer-events: none; z-index: 99999; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="capture-zone" class="screenshot-area">
        <div class="dashboard">
            <div class="dash-flex">
                <div><div style="font-size:11px; opacity:0.7; font-weight:700;" id="month-label">薪資統計</div><div class="total-money" id="total-salary">$0</div></div>
                <button class="export-btn" onclick="exportMonthlyReport()">📷 匯出報表</button>
            </div>
            <div class="config-grid">
                <div class="config-box"><label>💰 基礎日薪</label><input type="number" id="base-wage-input" class="config-input" value="3000" oninput="updateSalaryConfig()" onfocus="if(this.value=='3000'||this.value=='0')this.value=''" onblur="if(this.value=='')this.value='3000'; updateSalaryConfig();"></div>
                <div class="config-box"><label>🪪 證照加給</label><input type="number" id="bonus-input" class="config-input" value="0" oninput="updateSalaryConfig()" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'; updateSalaryConfig();"></div>
                <div class="config-box"><label>🧧 當月小費池</label><input type="number" id="tips-input" class="config-input" value="0" oninput="updateSalaryConfig()" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'; updateSalaryConfig();"></div>
            </div>
            <div class="stats"><span id="stat-full">🟢 全: 0天</span><span id="stat-half">🟡 半: 0天</span><span id="stat-rain">🌧️ 雨: 0天</span></div>
        </div>

        <div class="main-layout">
            <div class="calendar-container" id="calendar-container">
                <div class="calendar-header"><button class="cal-btn" onclick="changeMonth(-1)">◀</button><span id="calendar-title" onclick="handleTitleClick()">2026年06月</span><button class="cal-btn" onclick="changeMonth(1)">▶</button></div>
                <div class="week-days"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
                <div class="days-grid" id="days-grid"></div>
            </div>
        </div>
    </div>
    
    <div class="radial-menu" id="radial-menu">
        <div class="radial-bg"></div>
        <div class="radial-line" id="radial-line"></div>
        <div class="weapon-option opt-full" id="opt-full">🟢 全天</div>
        <div class="weapon-option opt-half" id="opt-half">🟡 半天</div>
        <div class="weapon-option opt-rain" id="opt-rain">🌧️ 雨天</div>
        <div class="weapon-option opt-clear" id="opt-clear">🧹 清除</div>
    </div>

    <!-- 備註抽屜 -->
    <div class="drawer-mask" id="drawer-mask" onclick="closeNoteDrawer()"></div>
    <div class="note-drawer" id="note-drawer">
        <div class="drawer-title"><span id="drawer-date-label">編輯備註</span><span onclick="closeNoteDrawer()" style="cursor:pointer;">✕</span></div>
        <div class="quick-tags">
            <button class="tag-btn" onclick="appendTag('點工')">點工</button>
            <button class="tag-btn" onclick="appendTag('加班')">加班</button>
            <button class="tag-btn" onclick="appendTag('夜班')">夜班</button>
            <button class="tag-btn" onclick="appendTag('灌漿')">灌漿</button>
            <button class="tag-btn" onclick="appendTag('扣款')">扣款</button>
            <button class="tag-btn" onclick="appendTag('借支')">借支</button>
        </div>
        <input type="text" id="drawer-note-input" class="drawer-input" placeholder="輸入備註或選擇快捷標籤...">
        <div class="drawer-actions">
            <button class="drawer-btn btn-clear" onclick="clearNote()">清除備註</button>
            <button class="drawer-btn btn-confirm" onclick="saveNote()">確認儲存</button>
        </div>
    </div>
    
    <div id="toast">儲存成功</div>
    <script>
        let holidaysCache = {};
        let weatherCache = {};
        let typhoonDays = {};

        // 農曆與浮動節日對照表 (2026 ~ 2035 基礎備援庫)
        const lunarHolidaysFallback = {
            2026: { "2026-02-16": "除夕", "2026-02-17": "初一", "2026-02-18": "初二", "2026-02-19": "初三", "2026-04-05": "清明節", "2026-06-19": "端午節", "2026-09-25": "中秋節" },
            2027: { "2027-02-05": "除夕", "2027-02-06": "初一", "2027-02-07": "初二", "2027-02-08": "初三", "2027-04-05": "清明節", "2027-06-09": "端午節", "2027-09-15": "中秋節" },
            2028: { "2028-01-25": "除夕", "2028-01-26": "初一", "2028-01-27": "初二", "2028-01-28": "初三", "2028-04-04": "清明節", "2028-05-28": "端午節", "2028-10-03": "中秋節" },
            2029: { "2029-02-12": "除夕", "2029-02-13": "初一", "2029-02-14": "初二", "2029-02-15": "初三", "2029-04-04": "清明節", "2029-06-16": "端午節", "2029-09-22": "中秋節" },
            2030: { "2030-02-02": "除夕", "2030-02-03": "初一", "2030-02-04": "初二", "2030-02-05": "初三", "2030-04-05": "清明節", "2030-06-05": "端午節", "2030-09-12": "中秋節" }
        };

        const todayObj = new Date();
        let currentYear = todayObj.getFullYear();
        let currentMonth = todayObj.getMonth();
        const todayStr = currentYear + "-" + String(currentMonth + 1).padStart(2, '0') + "-" + String(todayObj.getDate()).padStart(2, '0');

        let workRecords = JSON.parse(localStorage.getItem('cs_work_records')) || {};
        let baseWage = Number(localStorage.getItem('cs_base_wage')) || 3000;
        let certBonus = Number(localStorage.getItem('cs_cert_bonus')) || 0;
        let manualTipsPool = Number(localStorage.getItem('cs_manual_tips_pool')) || 0;
        let menuActive = false, menuCenterX = 0, menuCenterY = 0, activeDateStr = '', currentSelection = '', hasMovedFar = false;
        let lastVibratedOption = '';
        let justSelectedDate = ''; 
        let isExploding = false; 
        let editingDateStr = '';

        let clickCount = 0;
        let clickTimeout = null;

        function haptic(ms = 15) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        async function init() { 
            document.getElementById('base-wage-input').value = baseWage; 
            document.getElementById('bonus-input').value = certBonus; 
            document.getElementById('tips-input').value = calculateCurrentMonthTipsFromGrid(); 
            initSwipeGesture();
            
            // 載入預設演算法節日，隨後非同步從 API 更新覆蓋
            ensureBaseHolidays(currentYear);
            renderCalendar(); 

            await fetchHolidays(currentYear);
            fetchTaichungWeather();
            fetchTyphoonAlert();
        }

        // 演算法產生基礎國定假日
        function ensureBaseHolidays(year) {
            if (!holidaysCache[year]) {
                holidaysCache[year] = {
                    [`${year}-01-01`]: "元旦",
                    [`${year}-02-28`]: "二二八",
                    [`${year}-04-04`]: "兒童節",
                    [`${year}-05-01`]: "勞動節",
                    [`${year}-10-10`]: "國慶日"
                };
                if (lunarHolidaysFallback[year]) {
                    Object.assign(holidaysCache[year], lunarHolidaysFallback[year]);
                }
            }
        }

        // API 即時更新覆蓋
        async function fetchHolidays(year) {
            ensureBaseHolidays(year);
            try {
                const res = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${year}.json`);
                if (res.ok) {
                    const data = await res.json();
                    holidaysCache[year] = {};
                    data.forEach(item => {
                        if (item.description && item.isHoliday) {
                            const dStr = `${item.date.substring(0,4)}-${item.date.substring(4,6)}-${item.date.substring(6,8)}`;
                            holidaysCache[year][dStr] = item.description;
                        }
                    });
                    renderCalendar();
                }
            } catch (e) {
                console.warn(`${year} 年官方行事曆尚未公告，使用基礎預算節日`);
            }
        }

        async function fetchTaichungWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.1477&longitude=120.6736&daily=weather_code&timezone=Asia%2FTaipei');
                if (res.ok) {
                    const data = await res.json();
                    data.daily.time.forEach((dateStr, idx) => {
                        const code = data.daily.weather_code[idx];
                        weatherCache[dateStr] = getWeatherEmoji(code);
                    });
                    renderCalendar();
                }
            } catch (e) {
                console.warn('天氣 API 載入失敗');
            }
        }

        function getWeatherEmoji(code) {
            if (code === 0) return '☀️';
            if (code >= 1 && code <= 3) return '⛅';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 80 && code <= 82) return '🌧️';
            if (code >= 95) return '⛈️';
            return '☁️';
        }

        async function fetchTyphoonAlert() {
            try {
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://www.dgpa.gov.tw/typh/daily/nds.html');
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const html = await res.text();
                    if (html.includes('臺中市') || html.includes('台中市')) {
                        if (html.includes('停止上班') || html.includes('停止上課')) {
                            typhoonDays[todayStr] = '🌀颱風假';
                            showToast('🚨 台中市今日宣布停班停課！');
                            renderCalendar();
                        }
                    }
                }
            } catch (e) {
                console.warn('天然災害停班課連線略過');
            }
        }

        function calculateCurrentMonthTipsFromGrid() { 
            let t = 0; 
            const prefix = currentYear + "-" + String(currentMonth + 1).padStart(2, '0'); 
            for (let d in workRecords) { if (d.indexOf(prefix) === 0 && workRecords[d].tips) t += workRecords[d].tips; } 
            return t + manualTipsPool; 
        }

        function updateSalaryConfig() { 
            baseWage = Number(document.getElementById('base-wage-input').value) || 0; 
            certBonus = Number(document.getElementById('bonus-input').value) || 0; 
            let gTips = calculateCurrentMonthTipsFromGrid() - manualTipsPool; 
            let tTips = Number(document.getElementById('tips-input').value) || 0; 
            manualTipsPool = tTips - gTips; 
            localStorage.setItem('cs_base_wage', baseWage); 
            localStorage.setItem('cs_cert_bonus', certBonus); 
            localStorage.setItem('cs_manual_tips_pool', manualTipsPool); 
            recalculateIndividualWages(); 
            renderCalendar(); 
        }

        function recalculateIndividualWages() { 
            for (let d in workRecords) { 
                if (workRecords[d].status === '全天') workRecords[d].wage = baseWage; 
                if (workRecords[d].status === '半天') workRecords[d].wage = baseWage / 2; 
            } 
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords)); 
        }
        
        function renderCalendar() {
            if (isExploding) return;
            const grid = document.getElementById('days-grid'); grid.innerHTML = '';
            const mStr = String(currentMonth + 1).padStart(2, '0');
            document.getElementById('calendar-title').innerText = currentYear + "年" + mStr + "月";
            document.getElementById('month-label').innerText = currentYear + "年 " + mStr + "月 累積薪資";
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevMonthTotalDays = new Date(currentYear, currentMonth, 0).getDate();
            
            for (let i = firstDay - 1; i >= 0; i--) { 
                const cell = document.createElement('div'); 
                cell.className = 'day-cell other-month'; 
                cell.innerHTML = '<div class="cell-top"><span class="day-num">' + (prevMonthTotalDays - i) + '</span></div>'; 
                grid.appendChild(cell); 
            }

            const yHolidays = holidaysCache[currentYear] || {};

            for (let day = 1; day <= totalDays; day++) {
                const standardKey = currentYear + "-" + mStr + "-" + String(day).padStart(2, '0');
                const rec = workRecords[standardKey] || { status: '', wage: 0, tips: 0, note: '' };
                
                let holidayName = yHolidays[standardKey] || '';
                let isTyphoon = false;
                if (typhoonDays[standardKey]) {
                    holidayName = typhoonDays[standardKey];
                    isTyphoon = true;
                }

                const weatherIcon = weatherCache[standardKey] ? `<span class="weather-icon">${weatherCache[standardKey]}</span>` : '';

                const cell = document.createElement('div'); cell.className = 'day-cell'; cell.dataset.date = standardKey;
                
                if (standardKey === todayStr) cell.classList.add('today-box');

                cell.ondblclick = () => openNoteDrawer(standardKey);

                if (rec.status === '全天') cell.classList.add('status-full'); 
                if (rec.status === '半天') cell.classList.add('status-half'); 
                if (rec.status === '下雨停工') cell.classList.add('status-rain');
                
                let shortStatus = rec.status === '全天' ? '全' : (rec.status === '半天' ? '半' : (rec.status === '下雨停工' ? '雨' : ''));
                let tBadge = (rec.tips && rec.tips > 0) ? `<span class="day-tips-badge">+${rec.tips/1000}K</span>` : '';
                let nBadge = (rec.note && rec.note.trim() !== '') ? `<span class="day-note-badge">${rec.note}</span>` : '';
                
                let bounceClass = (standardKey === justSelectedDate && shortStatus !== '') ? 'bounce-active' : '';
                if (standardKey === justSelectedDate) cell.classList.add('single-bounce');

                cell.innerHTML = `
                    <div class="cell-top">
                        <div class="day-num-box"><span class="day-num">${day}</span>${weatherIcon}</div>
                        <span class="holiday-name ${isTyphoon ? 'typhoon' : ''}" title="${holidayName}">${holidayName}</span>
                    </div>
                    <span class="day-status ${bounceClass}">${shortStatus}</span>
                    <div class="cell-bottom">
                        ${nBadge}
                        ${tBadge}
                    </div>
                `;
                
                cell.addEventListener('touchstart', function(e) { 
                    if(isExploding || e.touches.length > 1) return; 
                    menuActive = true; 
                    hasMovedFar = false; 
                    lastVibratedOption = '';
                    activeDateStr = this.dataset.date; 
                    menuCenterX = e.touches[0].clientX; 
                    menuCenterY = e.touches[0].clientY; 
                    openRadialMenu(menuCenterX, menuCenterY); 
                }, { passive: true });

                grid.appendChild(cell);
            }
            justSelectedDate = ''; 
            calculateStats();
        }

        function initSwipeGesture() {
            const container = document.getElementById('calendar-container');
            let startX = 0, startY = 0;
            container.addEventListener('touchstart', (e) => {
                if (menuActive) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (menuActive || hasMovedFar) return;
                let diffX = e.changedTouches[0].clientX - startX;
                let diffY = e.changedTouches[0].clientY - startY;
                if (Math.abs(diffX) > 60 && Math.abs(diffY) < 40) {
                    haptic(20);
                    if (diffX > 0) changeMonth(-1);
                    else changeMonth(1);
                }
            }, { passive: true });
        }

        function openNoteDrawer(dateStr) {
            haptic(25);
            editingDateStr = dateStr;
            const rec = workRecords[dateStr] || { note: '' };
            document.getElementById('drawer-date-label').innerText = `備註：${dateStr}`;
            document.getElementById('drawer-note-input').value = rec.note || '';
            document.getElementById('drawer-mask').classList.add('show');
            document.getElementById('note-drawer').classList.add('show');
        }

        function closeNoteDrawer() {
            document.getElementById('drawer-mask').classList.remove('show');
            document.getElementById('note-drawer').classList.remove('show');
        }

        function appendTag(tagName) {
            haptic(10);
            const input = document.getElementById('drawer-note-input');
            input.value = input.value ? `${input.value} ${tagName}` : tagName;
        }

        function saveNote() {
            const noteVal = document.getElementById('drawer-note-input').value.trim();
            if (!workRecords[editingDateStr]) workRecords[editingDateStr] = { status: '', wage: 0, tips: 0 };
            workRecords[editingDateStr].note = noteVal;
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
            closeNoteDrawer();
            renderCalendar();
            showToast('📝 備註已儲存');
        }

        function clearNote() {
            if (workRecords[editingDateStr]) {
                workRecords[editingDateStr].note = '';
                localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
            }
            closeNoteDrawer();
            renderCalendar();
            showToast('🧹 備註已清除');
        }

        function exportMonthlyReport() {
            haptic(30);
            showToast('📸 正在產生薪資單...');
            html2canvas(document.getElementById('capture-zone'), {
                backgroundColor: '#0f172a',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `薪資表_${currentYear}_${currentMonth + 1}.png`;
                link.href = canvas.toDataURL();
                link.click();
                showToast('✅ 圖片已成功匯出');
            });
        }

        function handleTitleClick() {
            if (isExploding) return;
            const mStr = String(currentMonth + 1).padStart(2, '0');
            const prefix = currentYear + "-" + mStr;
            let hasData = false;
            for (let d in workRecords) { if (d.indexOf(prefix) === 0) { hasData = true; break; } }
            if (!hasData) return;

            clickCount++;
            haptic(15);
            clearTimeout(clickTimeout);
            clickTimeout = setTimeout(() => { clickCount = 0; }, 1500);

            if (clickCount >= 5 && clickCount < 10) {
                let remaining = 10 - clickCount;
                showToast(`⚠️ 欄位即將碎裂！再按 ${remaining} 次全數清除`);
            } else if (clickCount >= 10) {
                clickCount = 0;
                haptic([100, 50, 150]);
                triggerTitleExplosion(prefix);
            }
        }

        function triggerTitleExplosion(monthPrefix) {
            isExploding = true;
            const cells = document.querySelectorAll('.day-cell:not(.other-month)');
            const particles = [];
            const screenHeight = window.innerHeight;

            cells.forEach(cell => {
                const statusEl = cell.querySelector('.day-status');
                const badgeEl = cell.querySelector('.day-tips-badge');
                const noteEl = cell.querySelector('.day-note-badge');
                
                if (statusEl && statusEl.innerText.trim() !== '') {
                    particles.push(createParticleElement(statusEl.innerText, statusEl.getBoundingClientRect(), cell));
                    statusEl.style.opacity = '0';
                }
                if (badgeEl) {
                    particles.push(createParticleElement(badgeEl.innerText, badgeEl.getBoundingClientRect(), null, true));
                    badgeEl.style.opacity = '0';
                }
                if (noteEl) noteEl.style.opacity = '0';
                cell.className = 'day-cell';
            });

            let startTime = null;
            function physLoop(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;

                particles.forEach(p => {
                    p.vy += p.gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vRot;
                    const bottomLimit = screenHeight - p.height - 10;
                    if (p.y > bottomLimit) { p.y = bottomLimit; p.vy = -p.vy * p.bounce; p.vx *= 0.8; }
                    p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.rot}deg)`;
                    if (progress > 500) p.el.style.opacity = Math.max(0, 1 - (progress - 500) / 500);
                });

                if (progress < 1000) { requestAnimationFrame(physLoop); } else {
                    particles.forEach(p => p.el.remove());
                    for (let d in workRecords) { if (d.indexOf(monthPrefix) === 0) delete workRecords[d]; }
                    localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
                    isExploding = false;
                    manualTipsPool = 0;
                    localStorage.setItem('cs_manual_tips_pool', 0);
                    document.getElementById('tips-input').value = 0;
                    renderCalendar();
                    showToast('🧹 已清空當月全部工時紀錄');
                }
            }
            requestAnimationFrame(physLoop);
        }

        function createParticleElement(text, rect, cellObj, isBadge = false) {
            const el = document.createElement('div'); el.className = 'physics-particle'; el.innerText = text;
            el.style.left = '0px'; el.style.top = '0px'; el.style.width = rect.width + 'px'; el.style.height = rect.height + 'px';
            el.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
            if (isBadge) { el.style.background = '#e11d48'; el.style.color = '#ffffff'; el.style.fontSize = '9.5px'; } 
            else if (cellObj) {
                if (cellObj.classList.contains('status-full')) { el.style.background = '#00ff66'; el.style.color = '#000000'; }
                else if (cellObj.classList.contains('status-half')) { el.style.background = '#ffaa00'; el.style.color = '#000000'; }
                else if (cellObj.classList.contains('status-rain')) { el.style.background = '#450a0a'; el.style.color = '#f87171'; }
                el.style.fontSize = '20px';
            }
            document.body.appendChild(el);
            return { el: el, x: rect.left, y: rect.top, width: rect.width, height: rect.height, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.8) * 6, gravity: 0.4, bounce: 0.55, rot: 0, vRot: (Math.random() - 0.5) * 15 };
        }

        document.addEventListener('touchmove', function(e) {
            if (!menuActive || e.touches.length > 1) return; 
            const dx = e.touches[0].clientX - menuCenterX, dy = e.touches[0].clientY - menuCenterY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            if (distance > 10) { 
                const angle = Math.atan2(dy, dx); 
                const len = Math.min(distance, 80); 
                const line = document.getElementById('radial-line'); 
                line.style.width = len + 'px'; 
                line.style.transform = `rotate(${angle}rad)`; 
            } else { 
                document.getElementById('radial-line').style.width = '0px'; 
            }

            if (distance > 30) {
                hasMovedFar = true; 
                document.querySelectorAll('.weapon-option').forEach(el => { el.classList.remove('highlight'); el.style.opacity = '0.25'; });
                
                if (Math.abs(dy) > Math.abs(dx)) { 
                    if (dy < 0) { currentSelection = '全天'; document.getElementById('opt-full').classList.add('highlight'); } 
                    else { currentSelection = '下雨停工'; document.getElementById('opt-rain').classList.add('highlight'); } 
                } else { 
                    if (dx < 0) { currentSelection = '清除'; document.getElementById('opt-clear').classList.add('highlight'); } 
                    else { currentSelection = '半天'; document.getElementById('opt-half').classList.add('highlight'); } 
                }

                if (currentSelection !== lastVibratedOption) {
                    haptic(15);
                    lastVibratedOption = currentSelection;
                }
            } else { 
                currentSelection = ''; 
                lastVibratedOption = '';
                document.querySelectorAll('.weapon-option').forEach(el => { el.classList.remove('highlight'); el.style.opacity = '1'; }); 
            }
        }, { passive: true });

        document.addEventListener('touchend', function() {
            if (!menuActive) return; 
            menuActive = false; 
            document.getElementById('radial-menu').style.display = 'none';
            
            if (!hasMovedFar) { 
                if (workRecords[activeDateStr] && workRecords[activeDateStr].status) {
                    haptic([20, 40, 20]);
                    workRecords[activeDateStr].tips = (workRecords[activeDateStr].tips || 0) + 1000; 
                    justSelectedDate = activeDateStr; 
                    saveAndRefresh('🧧 紅包已疊加 +$' + workRecords[activeDateStr].tips);
                }
                return; 
            }
            
            if (!workRecords[activeDateStr]) workRecords[activeDateStr] = { status: '', wage: 0, tips: 0, note: '' };
            justSelectedDate = activeDateStr;
            
            if (currentSelection === '清除') { 
                haptic(30);
                delete workRecords[activeDateStr]; 
                justSelectedDate = ''; 
                saveAndRefresh('🧹 已清除紀錄'); 
            } else if (currentSelection === '全天') { 
                haptic(20);
                workRecords[activeDateStr].status = '全天'; 
                workRecords[activeDateStr].wage = baseWage; 
                saveAndRefresh('🟢 已記全天'); 
            } else if (currentSelection === '半天') { 
                haptic(20);
                workRecords[activeDateStr].status = '半天'; 
                workRecords[activeDateStr].wage = baseWage / 2; 
                saveAndRefresh('🟡 已記半天'); 
            } else if (currentSelection === '下雨停工') { 
                haptic(20);
                workRecords[activeDateStr].status = '下雨停工'; 
                workRecords[activeDateStr].wage = 0; 
                saveAndRefresh('🌧️ 已記下雨停工'); 
            }
            currentSelection = '';
        });

        function openRadialMenu(x, y) { 
            const m = document.getElementById('radial-menu'); 
            m.style.left = x + 'px'; 
            m.style.top = y + 'px'; 
            m.style.display = 'block'; 
            document.getElementById('radial-line').style.width = '0px'; 
            document.querySelectorAll('.weapon-option').forEach(el => { el.classList.remove('highlight'); el.style.opacity = '1'; }); 
        }

        function saveAndRefresh(msg) { 
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords)); 
            document.getElementById('tips-input').value = calculateCurrentMonthTipsFromGrid(); 
            renderCalendar(); 
            showToast(msg); 
        }
        
        function calculateStats() {
            let wageT = 0, f = 0, h = 0, r = 0, gTips = 0; 
            const prefix = currentYear + "-" + String(currentMonth + 1).padStart(2, '0');
            for (let d in workRecords) { 
                if (d.indexOf(prefix) === 0) { 
                    const rec = workRecords[d]; 
                    if (rec.status === '全天') { wageT += rec.wage; f++; } 
                    if (rec.status === '半天') { wageT += rec.wage; h++; } 
                    if (rec.status === '下雨停工') r++; 
                    if (rec.tips) gTips += rec.tips; 
                } 
            }
            let finalSalary = wageT + certBonus + gTips + manualTipsPool;
            document.getElementById('total-salary').innerText = '$' + finalSalary.toLocaleString();
            document.getElementById('stat-full').innerText = `🟢 全: ${f}天`; 
            document.getElementById('stat-half').innerText = `🟡 半: ${h}天`; 
            document.getElementById('stat-rain').innerText = `🌧️ 雨: ${r}天`;
        }

        async function changeMonth(dir) { 
            if(isExploding) return; 
            currentMonth += dir; 
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
            
            ensureBaseHolidays(currentYear);
            document.getElementById('tips-input').value = calculateCurrentMonthTipsFromGrid(); 
            renderCalendar(); 
            
            await fetchHolidays(currentYear);
        }

        function showToast(msg) { 
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.style.opacity = 1; 
            setTimeout(() => { t.style.opacity = 0; }, 1200); 
        }

        init();
    </script>
</body>
</html>
